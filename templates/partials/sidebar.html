
{% load static %}
<style>
    .sidebar__logo {
    width: 36px;         /* Increased from 32px to zoom it slightly */
    height: 36px;        /* Keeping it square for proper circle shape */
    object-fit: cover;  /* Ensures the image fills the circle without stretching, might crop edges slightly */
    border-radius: 50%; /* This creates the perfect circular shape */
    
    /* Optional: Ensure vertical alignment with the text next to it */
    vertical-align: middle; 
}
</style>
<aside class="sidebar">
<div class="sidebar__brand">
    <!-- Updated line: replaces the empty div with your static image -->
    <img src="{% static 'images/logo.png' %}" alt="EchoDesk Logo" class="sidebar__logo">

    <div>
        <div>EchoDesk</div>
        <small class="text-muted">Complaint System</small>
    </div>
</div>

    <div class="sidebar__section-label">
        Main
    </div>

    <nav class="sidebar__nav">

        <a href="{% url 'dashboard:user_dashboard' %}"
           class="sidebar__link">

            <span class="icon">🏠</span>
            Dashboard

        </a>

        <a href="{% url 'complaints:complaint_list' %}"
           class="sidebar__link">

            <span class="icon">📋</span>
            My Complaints

        </a>

        <a href="{% url 'complaints:complaint_create' %}"
           class="sidebar__link">

            <span class="icon">➕</span>
            New Complaint

        </a>

    </nav>

    <div class="sidebar__section-label">

        Account

    </div>

    <nav class="sidebar__nav">

        <a href="{% url 'auth:profile' %}"
           class="sidebar__link">

            <span class="icon">👤</span>
            Profile

        </a>

        <a href="{% url 'auth:change_password' %}"
           class="sidebar__link">

            <span class="icon">🔒</span>
            Password

        </a>

    </nav>

    {% if user.is_staff %}

    <div class="sidebar__section-label">

        Administration

    </div>

    <nav class="sidebar__nav">

        <a href="{% url 'dashboard:admin_dashboard' %}"
           class="sidebar__link">

            <span class="icon">⚙️</span>
            Admin Dashboard

        </a>

    </nav>

    {% endif %}

    <div class="sidebar__footer">

        <a href="{% url 'auth:logout' %}"
           class="sidebar__link">

            <span class="icon">🚪</span>
            Logout

        </a>

    </div>

</aside>
