<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - EchoDesk</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            width: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            display: flex !important;
            justify-content: center !important;
            align-items: center !important;
            min-height: 100vh !important;
            background: #f8f9fa !important;
            margin: 0 !important;
            padding: 0 !important;
        }

        /* Hide Django admin navbar if present */
        #header,
        .header,
        .navbar,
        nav,
        .admin-header,
        .topbar,
        .sidebar {
            display: none !important;
        }

        /* Auth page wrapper */
        .auth-page-wrapper {
            display: flex !important;
            justify-content: center !important;
            align-items: center !important;
            width: 100% !important;
            padding: 2rem 1rem !important;
            box-sizing: border-box !important;
        }

        /* Card styling */
        .auth__card {
            width: 100% !important;
            max-width: 580px !important;
            margin: 0 !important;
            padding: 2.5rem !important;
            background: white !important;
            border: 1px solid #e2e8f0 !important;
            border-radius: 12px !important;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.07), 0 10px 20px rgba(0, 0, 0, 0.05) !important;
            box-sizing: border-box !important;
        }
    </style>
</head>
<body>
    <div class="auth-page-wrapper">
        <div class="auth__card">
            <div class="auth__header">
                <h2 class="auth__title">Login to Your Account</h2>
                <p class="auth__subtitle">
                    Sign in to access your complaints and dashboard
                </p>
            </div>

            <form method="post" novalidate class="auth__form">
                {% csrf_token %}

                {% if form.non_field_errors %}
                <div class="auth__error">
                    {% for error in form.non_field_errors %}
                        <div>{{ error }}</div>
                    {% endfor %}
                </div>
                {% endif %}

                <div class="form-group mb-4">
                    <label for="id_username" class="form-label">Username</label>
                    <input
                        type="text"
                        name="username"
                        id="id_username"
                        class="form-control"
                        placeholder="Enter your username"
                        value="{{ form.username.value|default:'' }}"
                        required
                        autofocus
                    >
                </div>

                <div class="form-group mb-4">
                    <label for="id_password" class="form-label">Password</label>
                    <input
                        type="password"
                        name="password"
                        id="id_password"
                        class="form-control"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <button type="submit" class="btn btn--primary btn--full">
                    Login
                </button>
            </form>

            <div class="auth__footer">
                <span>Don't have an account?</span>
                <a href="{% url 'auth:register' %}" class="auth__link">
                    Register here
                </a>
            </div>
        </div>
    </div>
</body>
</html>
